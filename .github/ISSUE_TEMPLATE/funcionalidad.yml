name: Funcionalidad o tarea del harness
description: Implementar una tarea vinculada a un spec y sus criterios de aceptación.
title: "[ID] Resumen de la tarea"
body:
  - type: input
    id: feature
    attributes:
      label: ID de tarea
      placeholder: EST-MAT-01
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec asociado
      placeholder: specs/servicio-estudiantes/05-crear-matricula.md
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Alcance y dependencias
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación y pruebas
      description: Copia o enlaza los criterios relevantes del spec.
    validations:
      required: true
