name: Validar aplicaciones
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  cursos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pruebas y reporte de cursos
        working-directory: servicios/cursos
        run: mvn -B verify
      - name: Comprobar cobertura de líneas de cursos
        run: python harness/check_coverage.py jacoco servicios/cursos/target/site/jacoco/jacoco.xml
      - name: Guardar reportes de cursos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-cursos
          path: |
            servicios/cursos/target/site/jacoco/
            servicios/cursos/target/surefire-reports/
          if-no-files-found: warn
  estudiantes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install './servicios/estudiantes[test]'
      - name: Pruebas y reporte de estudiantes
        working-directory: servicios/estudiantes
        run: python -m pytest --cov=app --cov-report=xml:coverage.xml --junitxml=test-results.xml
      - name: Comprobar cobertura de líneas de estudiantes
        run: python harness/check_coverage.py coverage servicios/estudiantes/coverage.xml
      - name: Guardar reportes de estudiantes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-estudiantes
          path: |
            servicios/estudiantes/coverage.xml
            servicios/estudiantes/test-results.xml
          if-no-files-found: warn
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
      - run: npm run build
