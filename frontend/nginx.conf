server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/cursos { proxy_pass http://cursos:8080; }
    location /api/v1/reservas { return 404; }
    location /api/v1/estudiantes { proxy_pass http://estudiantes:8000; }
    location /api/v1/matriculas { proxy_pass http://estudiantes:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
