apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: academia/frontend
          ports: [{containerPort: 8080}]
          startupProbe: {httpGet: {path: /, port: 8080}, failureThreshold: 20, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 10}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector: {app: frontend}
  ports: [{port: 8080, targetPort: 8080}]
