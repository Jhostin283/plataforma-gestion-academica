apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: academia
spec:
  # El entorno debe establecer ingressClassName, host y TLS antes de aplicar.
  rules:
    - http:
        paths:
          - path: /api/v1/cursos
            pathType: Prefix
            backend: {service: {name: cursos, port: {number: 8080}}}
          - path: /api/v1/estudiantes
            pathType: Prefix
            backend: {service: {name: estudiantes, port: {number: 8000}}}
          - path: /api/v1/matriculas
            pathType: Prefix
            backend: {service: {name: estudiantes, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: frontend, port: {number: 8080}}}
