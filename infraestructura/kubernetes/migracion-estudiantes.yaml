apiVersion: batch/v1
kind: Job
metadata:
  name: migrar-estudiantes
  namespace: academia
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrar
          image: registry.invalid/academia/estudiantes:sin-configurar
          command: [alembic, upgrade, head]
          env:
            - {name: ESTUDIANTES_DB_URL, valueFrom: {secretKeyRef: {name: estudiantes-db, key: url}}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, capabilities: {drop: [ALL]}}
