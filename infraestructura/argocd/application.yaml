apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: academia
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Jhostin283/plataforma-gestion-academica.git
    targetRevision: developer
    path: infraestructura/kubernetes/base
  destination:
    server: https://kubernetes.default.svc
    namespace: academia
  # La sincronización es manual; no se habilitan autosync ni poda automática.
